name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Required so Environment variables/secrets on "github-pages" are available at BUILD time.
    # NEXT_PUBLIC_* values are baked into the static JS during `next build`.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show env presence (no secret values)
        env:
          HAS_SCRIPT_VAR: ${{ vars.NEXT_PUBLIC_GOOGLE_SCRIPT_URL != '' }}
          HAS_SCRIPT_SECRET: ${{ secrets.NEXT_PUBLIC_GOOGLE_SCRIPT_URL != '' }}
        run: |
          echo "NEXT_PUBLIC_SITE_URL set: ${{ vars.NEXT_PUBLIC_SITE_URL != '' }}"
          echo "NEXT_PUBLIC_BASE_PATH set: ${{ vars.NEXT_PUBLIC_BASE_PATH != '' }}"
          echo "NEXT_PUBLIC_FEATURED_YOUTUBE_ID set: ${{ vars.NEXT_PUBLIC_FEATURED_YOUTUBE_ID != '' }}"
          echo "NEXT_PUBLIC_GOOGLE_SCRIPT_URL var set: $HAS_SCRIPT_VAR"
          echo "NEXT_PUBLIC_GOOGLE_SCRIPT_URL secret set: $HAS_SCRIPT_SECRET"

      - name: Build static site for custom domain (root)
        env:
          # Custom domain serves from site ROOT — do not use /swastam basePath
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://swastaminteriors.com' }}
          # Force empty base path for swastaminteriors.com (ignore stale /swastam env var)
          NEXT_PUBLIC_BASE_PATH: ''
          # Featured home video (force so a stale GitHub Environment var cannot override)
          NEXT_PUBLIC_FEATURED_YOUTUBE_ID: 'vf5LaUHFUGc'
          NEXT_PUBLIC_GOOGLE_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_SCRIPT_URL || secrets.NEXT_PUBLIC_GOOGLE_SCRIPT_URL }}
        run: |
          echo "SITE_URL=$NEXT_PUBLIC_SITE_URL"
          echo "BASE_PATH='${NEXT_PUBLIC_BASE_PATH}' (must be empty for custom domain)"
          if [ -n "$NEXT_PUBLIC_GOOGLE_SCRIPT_URL" ]; then
            echo "Google Script URL is present (length ${#NEXT_PUBLIC_GOOGLE_SCRIPT_URL})"
            printf '%s\n' "{\"googleScriptUrl\":\"$NEXT_PUBLIC_GOOGLE_SCRIPT_URL\"}" > public/form-config.json
          else
            echo "::warning::NEXT_PUBLIC_GOOGLE_SCRIPT_URL is empty — using committed public/form-config.json if present."
          fi
          # Keep CNAME for custom domain
          printf '%s\n' "swastaminteriors.com" > public/CNAME
          npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
